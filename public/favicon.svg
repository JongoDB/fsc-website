<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <!-- Circular background -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)"/>
  <!-- Subtle ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(0,168,255,0.15)" stroke-width="0.5"/>
  <!-- Swoosh arc -->
  <ellipse cx="50" cy="50" rx="40" ry="30" transform="rotate(-30 50 50)"
           fill="none" stroke="url(#swooshGrad)" stroke-width="4"
           stroke-dasharray="170 60" stroke-dashoffset="30"
           stroke-linecap="round" clip-path="url(#circleClip)"/>
  <!-- FSC text - white on dark -->
  <text x="50" y="60" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-weight="900" font-size="30" fill="#ffffff" letter-spacing="2">FSC</text>
</svg>
