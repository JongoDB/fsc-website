<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1729"/>
      <stop offset="50%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2c5a8d"/>
    </linearGradient>
  </defs>
  <!-- Swoosh arc - diagonal elliptical sweep matching brand logo -->
  <ellipse cx="50" cy="50" rx="46" ry="36" transform="rotate(-30 50 50)"
           fill="none" stroke="url(#swooshGrad)" stroke-width="5.5"
           stroke-dasharray="200 60" stroke-dashoffset="30"
           stroke-linecap="round"/>
  <!-- FSC text - dark navy -->
  <text x="50" y="62" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-weight="900" font-size="36" fill="#0c1729" letter-spacing="1">FSC</text>
</svg>
