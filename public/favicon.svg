<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"></stop>
      <stop offset="100%" stop-color="#00d4ff"></stop>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50"></circle>
    </clipPath>
  </defs>
  
  <circle cx="50" cy="50" r="50" fill="#ffffff"></circle>
  
  <ellipse cx="50" cy="50" rx="40" ry="30" transform="rotate(-30 50 50)" fill="none" stroke="url(#swooshGrad)" stroke-width="4" stroke-dasharray="170 60" stroke-dashoffset="30" stroke-linecap="round" clip-path="url(#circleClip)"></ellipse>
  
  <text x="50" y="60" text-anchor="middle" font-family="&#39;Arial Black&#39;, &#39;Helvetica Neue&#39;, sans-serif" font-weight="900" font-size="30" fill="#0a2540" letter-spacing="2">FSC</text>
</svg>